name: build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases on tag pushes

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, arm64 ]
    # Code signing switches on once these repository secrets exist (docs/RELEASING.md).
    env:
      CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
      CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $v = '1.0.0.0'
          if ('${{ github.ref }}' -like 'refs/tags/v*') { $v = '${{ github.ref_name }}'.TrimStart('v') }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version = $v"

      - name: Restore
        run: dotnet restore Pickets/Pickets.csproj

      # Unit tests (rules, repair, snapping, screen fitting, snapshots). Once per run is
      # enough; a failure stops the build, so a broken release never gets published.
      - name: Test
        if: matrix.arch == 'x64'
        run: dotnet test tests/Pickets.Tests -c Release

      # Self-contained publish: the installer needs no .NET runtime on the user's PC.
      - name: Publish app (self-contained ${{ matrix.arch }})
        run: >
          dotnet publish Pickets/Pickets.csproj
          -c Release
          -r win-${{ matrix.arch }}
          --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ steps.ver.outputs.version }}
          -o ${{ github.workspace }}\publish\${{ matrix.arch }}

      - name: Sign app (if a certificate is configured)
        shell: pwsh
        run: >
          ./.github/scripts/sign.ps1 -Files
          publish\${{ matrix.arch }}\Pickets.exe,publish\${{ matrix.arch }}\Pickets.dll

      # WiX SDK builds the MSI; no Visual Studio / extension required.
      - name: Build MSI (WiX)
        run: >
          dotnet build Pickets.Installer/Pickets.Installer.wixproj
          -c Release
          -p:Platform=${{ matrix.arch }}
          -p:PublishDir=${{ github.workspace }}\publish\${{ matrix.arch }}
          -p:ProductVersion=${{ steps.ver.outputs.version }}

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $msi = Get-ChildItem -Recurse -Filter *.msi -Path Pickets.Installer | Select-Object -First 1
          if (-not $msi) { throw 'No MSI produced.' }
          Copy-Item $msi.FullName "out\Pickets-${{ matrix.arch }}.msi" -Force
          ./.github/scripts/sign.ps1 -Files "out\Pickets-${{ matrix.arch }}.msi"
          # Copies installed before the rename (OpenFences) look for OpenFences-<arch>.msi to update.
          Copy-Item "out\Pickets-${{ matrix.arch }}.msi" "out\OpenFences-${{ matrix.arch }}.msi"
          Compress-Archive -Path "publish\${{ matrix.arch }}\*" -DestinationPath "out\Pickets-${{ matrix.arch }}-portable.zip" -Force
          Get-ChildItem out

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Pickets-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true

  # Opens a PR at microsoft/winget-pkgs for each release, once a WINGET_TOKEN secret exists
  # and the first version has been submitted by hand (docs/RELEASING.md).
  winget:
    name: Publish to winget
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Skip (not configured)
        if: env.WINGET_TOKEN == ''
        run: echo "No WINGET_TOKEN secret; skipping winget."
      - uses: vedantmgoyal9/winget-releaser@v2
        if: env.WINGET_TOKEN != ''
        with:
          identifier: chrisdfennell.Pickets
          installers-regex: 'Pickets-(x64|arm64)\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}
