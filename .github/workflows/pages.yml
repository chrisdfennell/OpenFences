name: pages

# Publishes the project website (site/) to GitHub Pages:
# https://chrisdfennell.github.io/Pickets/
on:
  push:
    branches: [ master ]
    paths: [ 'site/**', 'Pickets/Docs/**', 'Pickets/Assets/open-fence.png', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # The screenshots and icon live with the app; copy them in rather than keeping duplicates.
      - name: Assemble site
        run: |
          mkdir -p site/assets
          cp Pickets/Docs/screenshot-*.png Pickets/Docs/backgrounds-demo.mp4 site/assets/
          cp Pickets/Assets/open-fence.png site/assets/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
